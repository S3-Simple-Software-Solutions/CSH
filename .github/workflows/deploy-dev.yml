name: Deploy CSH (dev)

# Cada push a dev se despliega al entorno dev:
#   herediano-dev.milocalhost.work -> nginx -> 127.0.0.1:1421 -> contenedor csh-dev-1421
#
# La app se compila DENTRO del contenedor (cicd/Containerfile), asi que el
# servidor no necesita tener instalados el SDK de .NET ni Node: solo podman.
# A diferencia de produccion, no crea versiones de release ni publica en GitHub.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csh-dev-deploy
  cancel-in-progress: false

env:
  APP_ROOT: /home/tony/Desktop/APP_CSH
  REPO_URL: https://github.com/S3-Simple-Software-Solutions/CSH.git
  DEV_PORT: "1421"
  DEV_APP_URL: https://herediano-dev.milocalhost.work

jobs:
  deploy:
    name: Auto Deploy (dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse ALL_SECRETS
        id: vars
        shell: bash
        env:
          ALL_SECRETS: ${{ secrets.ALL_SECRETS }}
        run: |
          set -euo pipefail

          printf '%s' "$ALL_SECRETS" > /tmp/secrets.env

          get() {
            local line
            line="$(grep -m1 "^$1=" /tmp/secrets.env || true)"
            printf '%s' "${line#*=}"
          }

          echo "ngrok_host=$(get NGROK_HOST)" >> "$GITHUB_OUTPUT"
          echo "ngrok_port=$(get NGROK_PORT)" >> "$GITHUB_OUTPUT"
          echo "deploy_user=$(get DEPLOY_USER)" >> "$GITHUB_OUTPUT"

          DEPLOY_SSH_KEY_B64="$(get DEPLOY_SSH_KEY_B64)"
          if [ -z "$DEPLOY_SSH_KEY_B64" ]; then
            echo "::error::DEPLOY_SSH_KEY_B64 is missing from ALL_SECRETS"
            exit 1
          fi

          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Deploy dev via SSH
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
          NGROK_HOST: ${{ steps.vars.outputs.ngrok_host }}
          NGROK_PORT: ${{ steps.vars.outputs.ngrok_port }}
          DEPLOY_USER: ${{ steps.vars.outputs.deploy_user }}
        run: |
          set -euo pipefail

          ssh -i /tmp/deploy_key \
              -p "$NGROK_PORT" \
              -o StrictHostKeyChecking=no \
              "$DEPLOY_USER@$NGROK_HOST" \
              "APP_ROOT='$APP_ROOT' REPO_URL='$REPO_URL' DEPLOY_SHA='$DEPLOY_SHA' DEV_PORT='$DEV_PORT' bash -se" <<'ENDSSH'
            set -euo pipefail

            SHORT_SHA="${DEPLOY_SHA::7}"
            DEV_VERSION="dev-$SHORT_SHA"
            SOURCE_DIR="$APP_ROOT/source"
            CONTAINER="csh-dev-$DEV_PORT"

            echo "== Preparando deploy dev: $DEV_VERSION =="

            if [ ! -d "$SOURCE_DIR/.git" ]; then
              if [ -d "$APP_ROOT/.git" ]; then
                SOURCE_DIR="$APP_ROOT"
              else
                git clone "$REPO_URL" "$SOURCE_DIR"
              fi
            fi

            cd "$SOURCE_DIR"
            git remote set-url origin "$REPO_URL" || true
            git fetch --prune origin dev
            git rev-parse --verify "$DEPLOY_SHA^{commit}" >/dev/null

            # El build sale de un arbol limpio del commit desplegado, no del
            # working tree del servidor, que puede tener cambios sin commitear.
            BUILD_DIR="$(mktemp -d)"
            trap 'rm -rf "$BUILD_DIR"' EXIT
            git archive "$DEPLOY_SHA" | tar -x -C "$BUILD_DIR"

            echo "== Construyendo imagen ($DEV_VERSION) =="
            cd "$BUILD_DIR"
            # APP_VERSION/COMMIT_SHA terminan en el HTML como `dev-<short sha>`
            # (issue #119) — el mismo short sha que se ve en $DEV_VERSION y en
            # el aviso de Discord. En dev no hay version de release, asi que la
            # etiqueta es "dev" a secas.
            podman build -f cicd/Containerfile \
              --build-arg APP_VERSION=dev \
              --build-arg COMMIT_SHA="$DEPLOY_SHA" \
              -t "csh:$DEV_VERSION" -t csh:dev .

            echo "== Reemplazando el contenedor =="
            # El puerto lo pudo haber tomado el servicio systemd del stack viejo.
            systemctl --user disable --now csh-dev.service >/dev/null 2>&1 || true
            podman rm -f "$CONTAINER" >/dev/null 2>&1 || true
            podman run -d \
              --name "$CONTAINER" \
              --restart=always \
              -p "$DEV_PORT:8080" \
              "csh:$DEV_VERSION"

            echo "== Health check (dev :$DEV_PORT) =="
            for attempt in {1..30}; do
              if curl --fail --silent --show-error "http://127.0.0.1:$DEV_PORT/healthz"; then
                echo ""
                echo "Health check OK para $DEV_VERSION"
                # Sin esto, cada deploy deja una imagen y el disco se llena solo.
                podman image prune -f >/dev/null 2>&1 || true
                exit 0
              fi
              echo "Esperando el health de dev... ($attempt/30)"
              sleep 2
            done

            echo "Health check fallido para $DEV_VERSION"
            podman logs --tail 100 "$CONTAINER" || true
            exit 1
          ENDSSH

      - name: Dev deploy summary
        if: always()
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "### CSH dev deploy"
            echo ""
            echo "- Entorno: ${DEV_APP_URL}"
            echo "- Commit: \`$DEPLOY_SHA\`"
            echo "- Puerto: \`${DEV_PORT}\` (contenedor csh-dev-${DEV_PORT})"
            echo "- Run: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Discord result
        if: always()
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_SHA: ${{ github.sha }}
          COMPARE_URL: ${{ github.event.compare }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "Sin DISCORD_WEBHOOK_URL, no se avisa."
            exit 0
          fi

          SHORT_SHA="${DEPLOY_SHA::7}"
          DEV_VERSION="dev-$SHORT_SHA"

          case "$JOB_STATUS" in
            success)   TITLE="Nueva version en dev: $DEV_VERSION"; COLOR=5763719 ;;
            cancelled) TITLE="Deploy a dev cancelado ($DEV_VERSION)"; COLOR=16776960 ;;
            *)         TITLE="Deploy a dev fallido ($DEV_VERSION)"; COLOR=15548997 ;;
          esac

          # Que trae esta version: el asunto de cada commit del push. El harness
          # (§10) pide siempre version, cambios y como probarla.
          CHANGES="$(git log --no-merges --pretty='- %s' "${BEFORE_SHA}..${DEPLOY_SHA}" 2>/dev/null | head -10 || true)"
          if [ -z "$CHANGES" ]; then
            CHANGES="- $(git log -1 --pretty=%s "$DEPLOY_SHA")"
          fi

          if [ "$JOB_STATUS" = "success" ]; then
            DESC="$(printf 'Probala en %s\n\n**Cambios**\n%s' "$DEV_APP_URL" "$CHANGES")"
          else
            DESC="$(printf 'El deploy a dev no completo (%s).\n\n**Cambios que intentaba desplegar**\n%s' "$JOB_STATUS" "$CHANGES")"
          fi

          jq -n \
            --arg title "$TITLE" \
            --arg desc "$DESC" \
            --arg url "$DEV_APP_URL" \
            --arg version "$DEV_VERSION" \
            --arg run "$RUN_URL" \
            --arg diff "${COMPARE_URL:-$RUN_URL}" \
            --argjson color "$COLOR" \
            '{embeds: [{
               title: $title,
               description: $desc,
               url: $url,
               color: $color,
               fields: [
                 {name: "Entorno", value: "dev", inline: true},
                 {name: "Version", value: $version, inline: true},
                 {name: "Probar", value: $url},
                 {name: "Diff", value: $diff},
                 {name: "Run", value: $run}
               ]
             }]}' > /tmp/discord.json

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d @/tmp/discord.json \
            "$DISCORD_WEBHOOK_URL"
